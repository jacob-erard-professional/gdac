openapi: 3.0.3
info:
  title: Data Cleaning Orchestrator API (Planned)
  version: 0.1.0
  description: |
    Planned HTTP interface that mirrors CLI functionality for running pipeline steps.
    MVP remains CLI-only; this contract documents future service behavior.
servers:
  - url: http://localhost:8000
paths:
  /pipeline/run:
    post:
      summary: Run the full pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineRunRequest'
      responses:
        '200':
          description: Pipeline run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
  /steps/{step_name}/run:
    post:
      summary: Run a single step
      parameters:
        - name: step_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepRunRequest'
      responses:
        '200':
          description: Step run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
  /manifests/{run_id}/{step_name}:
    get:
      summary: Fetch a manifest for a run
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: step_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
components:
  schemas:
    PipelineRunRequest:
      type: object
      required: [input_dir, output_dir, config_path]
      properties:
        input_dir:
          type: string
        output_dir:
          type: string
        config_path:
          type: string
        dry_run:
          type: boolean
    StepRunRequest:
      type: object
      required: [input_dir, output_dir, config_path]
      properties:
        input_dir:
          type: string
        output_dir:
          type: string
        config_path:
          type: string
        dry_run:
          type: boolean
    RunResult:
      type: object
      required: [run_id, status, manifest_path]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [success, failed]
        manifest_path:
          type: string
    Manifest:
      type: object
      required:
        - step_name
        - run_id
        - input_files
        - output_files
        - rows_in
        - rows_out
        - rows_rejected
        - rejection_reasons
        - created_at
      properties:
        step_name:
          type: string
        run_id:
          type: string
        input_files:
          type: array
          items:
            $ref: '#/components/schemas/FileHash'
        output_files:
          type: array
          items:
            $ref: '#/components/schemas/FileHash'
        rows_in:
          type: integer
        rows_out:
          type: integer
        rows_rejected:
          type: integer
        rejection_reasons:
          type: object
          additionalProperties:
            type: integer
        created_at:
          type: string
    FileHash:
      type: object
      required: [path, sha256]
      properties:
        path:
          type: string
        sha256:
          type: string
