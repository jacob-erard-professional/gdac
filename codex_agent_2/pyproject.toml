[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-pipeline"
version = "0.1.0"
description = "Modular resumable NLP analytics pipeline"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12,<1.0",
  "pydantic>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "networkx>=3.3,<4.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
pipeline = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
