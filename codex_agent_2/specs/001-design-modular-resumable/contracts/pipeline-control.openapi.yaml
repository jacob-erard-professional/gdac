openapi: 3.1.0
info:
  title: Pipeline Control Plane API
  version: 0.1.0
  description: >-
    Optional API contract for controlling and inspecting the modular NLP pipeline.
    CLI remains the primary execution interface in MVP.
servers:
  - url: http://localhost:8080
paths:
  /v1/stages/{stageName}/runs:
    post:
      summary: Run a single stage
      operationId: runSingleStage
      parameters:
        - in: path
          name: stageName
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunStageRequest'
      responses:
        '202':
          description: Stage run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/pipelines/runs:
    post:
      summary: Run selected subset of stages
      operationId: runStageSubset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSubsetRequest'
      responses:
        '202':
          description: Subset run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '409':
          description: Dependency violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /v1/manifests/{pipelineName}:
    get:
      summary: Retrieve pipeline manifest
      operationId: getManifest
      parameters:
        - in: path
          name: pipelineName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Manifest found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineManifest'
        '404':
          description: Manifest not found

  /v1/agents/hashtag-normalization/runs:
    post:
      summary: Run hashtag equivalence discovery loop
      operationId: runHashtagNormalization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunHashtagAgentRequest'
      responses:
        '202':
          description: Agent run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'

  /v1/hashtag-mappings:
    get:
      summary: List hashtag mappings
      operationId: listHashtagMappings
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [draft, pending_review, approved, rejected]
      responses:
        '200':
          description: Mapping list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HashtagMapping'

components:
  schemas:
    RunStageRequest:
      type: object
      required: [inputArtifacts, outputArtifacts, configPath, dryRun]
      properties:
        inputArtifacts:
          type: array
          items:
            type: string
        outputArtifacts:
          type: array
          items:
            type: string
        configPath:
          type: string
        dryRun:
          type: boolean

    RunSubsetRequest:
      type: object
      required: [stages, inputArtifacts, outputRoot, configPath, skipCompleted, dryRun]
      properties:
        stages:
          type: array
          items:
            type: string
        inputArtifacts:
          type: array
          items:
            type: string
        outputRoot:
          type: string
        configPath:
          type: string
        skipCompleted:
          type: boolean
        dryRun:
          type: boolean

    RunHashtagAgentRequest:
      type: object
      required: [candidateArtifact, outputArtifact, configPath, iteration]
      properties:
        candidateArtifact:
          type: string
        outputArtifact:
          type: string
        configPath:
          type: string
        iteration:
          type: integer
          minimum: 1
        reviewThreshold:
          type: number
          minimum: 0
          maximum: 1

    RunResponse:
      type: object
      required: [runId, accepted, status]
      properties:
        runId:
          type: string
        accepted:
          type: boolean
        status:
          type: string
          enum: [started, queued]

    ValidationError:
      type: object
      required: [code, message, stage, artifact_path, schema_version, details]
      properties:
        code:
          type: string
          enum: [SCHEMA_MISMATCH, MISSING_FIELD, TYPE_ERROR, CONSTRAINT_VIOLATION, DEPENDENCY_ERROR]
        message:
          type: string
        stage:
          type: string
        artifact_path:
          type: string
        schema_version:
          type: string
        details:
          type: object
          additionalProperties: true

    PipelineManifest:
      type: object
      required: [manifestVersion, pipelineName, updatedAt, stages, runs, artifacts]
      properties:
        manifestVersion:
          type: string
        pipelineName:
          type: string
        updatedAt:
          type: string
          format: date-time
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageDefinition'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/StageRunRecord'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactRecord'

    StageDefinition:
      type: object
      required: [name, dependencies, inputSchemaVersions, outputSchemaVersions]
      properties:
        name:
          type: string
        dependencies:
          type: array
          items:
            type: string
        inputSchemaVersions:
          type: array
          items:
            type: string
        outputSchemaVersions:
          type: array
          items:
            type: string

    StageRunRecord:
      type: object
      required:
        [runId, stageName, status, startTime, configHash, inputArtifactIds, outputArtifactIds, determinism]
      properties:
        runId:
          type: string
        stageName:
          type: string
        event:
          type: string
        year:
          type: integer
        status:
          type: string
          enum: [started, succeeded, failed, skipped]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        configHash:
          type: string
        inputArtifactIds:
          type: array
          items:
            type: string
        outputArtifactIds:
          type: array
          items:
            type: string
        determinism:
          type: object
          additionalProperties: true

    ArtifactRecord:
      type: object
      required: [artifactId, artifactType, schemaVersion, path, checksum, createdAt, producedByStage]
      properties:
        artifactId:
          type: string
        artifactType:
          type: string
        schemaVersion:
          type: string
        path:
          type: string
        checksum:
          type: string
        createdAt:
          type: string
          format: date-time
        producedByStage:
          type: string

    HashtagMapping:
      type: object
      required: [mappingId, rawTag, canonicalTag, confidence, state, agentRunId, createdAt]
      properties:
        mappingId:
          type: string
        rawTag:
          type: string
        canonicalTag:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        state:
          type: string
          enum: [draft, pending_review, approved, rejected]
        evidence:
          type: array
          items:
            type: string
        agentRunId:
          type: string
        createdAt:
          type: string
          format: date-time
