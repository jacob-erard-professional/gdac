openapi: 3.0.3
info:
  title: Sentiment Agent Run Contract
  version: 0.1.0
  description: Contract for year-scoped agentic sentiment runs and artifacts.
servers:
  - url: https://pipeline.local
paths:
  /sentiment/runs:
    post:
      summary: Start a sentiment run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SentimentRunRequest"
      responses:
        "200":
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentRunResponse"
  /sentiment/runs/{runId}:
    get:
      summary: Get a sentiment run result
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run status and artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentimentRunResponse"
components:
  schemas:
    SentimentRunRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [year, data_dir]
        year:
          type: string
          pattern: "^[0-9]{4}$"
        dataDir:
          type: string
        dryRun:
          type: boolean
        verbose:
          type: boolean
        withPipeline:
          type: boolean
    SentimentRecord:
      type: object
      required: [tweet_id, year, final, agents, flags]
      properties:
        tweet_id:
          type: string
        year:
          type: integer
        final:
          type: object
          required: [sentiment, confidence]
          properties:
            sentiment:
              type: string
              enum: [positive, neutral, negative]
            confidence:
              type: number
              minimum: 0
              maximum: 1
        agents:
          type: object
          required: [normalizer, polarity, emotion, sarcasm]
          properties:
            normalizer:
              type: object
            polarity:
              type: object
            emotion:
              type: object
            sarcasm:
              type: object
        flags:
          type: array
          items:
            type: string
    SentimentRunResponse:
      type: object
      required: [runId, status, year, artifacts]
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [success, failed, running]
        year:
          type: string
        artifacts:
          type: object
          required: [records, summary]
          properties:
            records:
              type: string
            summary:
              type: string
