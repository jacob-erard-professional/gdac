event: super-bowl
output_root: outputs
raw_root: data/raw
cleaned_root: data/cleaned
processed_root: data/processed
min_text_length: 3

input_format: csv
chunk_size: 100000
eda_top_n: 500
nlp_similarity_threshold: 0.72
nlp_sample_limit: 20
nlp_min_confidence: 0.45
nlp_min_margin: 0.10
nlp_min_training_rows: 200
brand_typo_similarity_threshold: 0.87
brand_top_n: 300
csv_delimiter: ","
csv_encoding: "utf-8"

csv_columns:
  source_record_id: id
  event_name: keyword
  year: created_at
  text: text
  brand_ad_name: brand_ad_name
  retweet_count: public_metrics.retweet_count
  like_count: public_metrics.like_count
  reply_count: public_metrics.reply_count
  quote_count: public_metrics.quote_count
  hashtags: entities.hashtags
  mentions: entities.mentions
